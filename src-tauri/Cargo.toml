[package]
name = "fosspad"
version = "0.1.1"
description = "A FOSS OneNote-style notebook app backed by Markdown"
authors = ["you"]
edition = "2021"

[lib]
name = "fosspad_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
aes-gcm = { version = "0.11", features = ["getrandom"] }
getrandom = "0.4"
sha2 = "0.11"
base64 = "0.23"
tiny_http = "0.12"
portpicker = "0.1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
