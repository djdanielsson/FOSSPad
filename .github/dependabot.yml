version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # @mdxeditor/editor still pins lexical ^0.48 and nests its own copy, so
      # 0.53 produces two LexicalNode classes and the TS build fails on the
      # branded field. Drop this entry once mdxeditor accepts a newer lexical.
      - dependency-name: "lexical"
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
